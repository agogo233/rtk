name: Build

on:
  push:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for artifact naming (e.g., v0.34.3)'
        required: false
        type: string
        default: 'latest'
      profile:
        description: 'Build profile'
        required: false
        type: choice
        default: 'release'
        options:
          - release
          - dev

permissions:
  contents: read
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux x86_64 (static musl)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: |
          cargo build \
            --profile ${{ inputs.profile || 'release' }} \
            --target x86_64-unknown-linux-musl
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Verify static binary
        run: |
          BIN=target/x86_64-unknown-linux-musl/${{ inputs.profile || 'release' }}/rtk
          echo "### Binary info" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          file "$BIN" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          readelf -d "$BIN" 2>&1 | head -5 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          file "$BIN" | grep -qiE "statically linked|static-pie linked" || {
            echo "::error::Binary is NOT statically linked!"
            file "$BIN"
            exit 1
          }
          echo "::notice::Binary is statically linked ✓"

      - name: Package
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/${{ inputs.profile || 'release' }}/rtk "dist/rtk-linux-amd64"
          cd dist
          tar -czvf "../rtk-linux-amd64-${VERSION}.tar.gz" rtk-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtk-linux-amd64-${{ inputs.version || github.ref_name }}
          path: rtk-linux-amd64-${{ inputs.version || github.ref_name }}.tar.gz

  build-windows:
    name: Build Windows ${{ matrix.target_label }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            target_label: amd64 (MSVC)
            artifact_name: rtk-windows-amd64-msvc
          - target: x86_64-pc-windows-gnu
            target_label: amd64 (GNU)
            artifact_name: rtk-windows-amd64-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: pwsh
        run: |
          if ("${{ matrix.target }}" -eq "x86_64-pc-windows-gnu") {
            $wrapper = @'
          @echo off
          set "args=%*"
          set "args=%args:/STACK:=-Wl,--stack,%"
          x86_64-w64-mingw32-gcc %args%
          '@
            $wrapper | Out-File -FilePath "$env:TEMP\linkwrap.cmd" -Encoding ascii
            $env:CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER = "$env:TEMP\linkwrap.cmd"
          }
          cargo build `
            --profile ${{ inputs.profile || 'release' }} `
            --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}

      - name: Verify binary
        shell: pwsh
        run: |
          $BIN = "target\${{ matrix.target }}\${{ inputs.profile || 'release' }}\rtk.exe"
          if (-not (Test-Path $BIN)) {
            Write-Error "Binary not found at $BIN"
            exit 1
          }
          $size = (Get-Item $BIN).Length
          echo "### Binary info" >> $env:GITHUB_STEP_SUMMARY
          echo '```' >> $env:GITHUB_STEP_SUMMARY
          echo "Binary: $BIN" >> $env:GITHUB_STEP_SUMMARY
          echo "Size: $size bytes" >> $env:GITHUB_STEP_SUMMARY
          echo '```' >> $env:GITHUB_STEP_SUMMARY
          Write-Output "Binary size: $size bytes"

      - name: Package
        shell: pwsh
        run: |
          $VERSION = "${{ inputs.version || github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target\${{ matrix.target }}\${{ inputs.profile || 'release' }}\rtk.exe" "dist\${{ matrix.artifact_name }}.exe"
          Compress-Archive -Path "dist\${{ matrix.artifact_name }}.exe" -DestinationPath "${{ matrix.artifact_name }}-$VERSION.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ inputs.version || github.ref_name }}
          path: ${{ matrix.artifact_name }}-${{ inputs.version || github.ref_name }}.zip

  release:
    name: Create Release (latest)
    needs: [build-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: rtk-linux-amd64-${{ inputs.version || github.ref_name }}
          path: dist

      - name: Extract binary
        run: |
          cd dist
          tar -xzf rtk-linux-amd64-*.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          files: dist/rtk-linux-amd64
          prerelease: false
          generate_release_notes: true